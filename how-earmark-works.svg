<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif">
  <title>How Earmark works</title>
  <desc>A funder (for example a company) puts USDC into a pot for one purpose. The recipient can pay only the approved payees. Payments to anyone else, including the recipient's own wallet, are blocked by the contract. Every payment leaves a public receipt, and unspent money goes back to the funder after the end date.</desc>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F6B5C"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B42318"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6775"/></marker>
  </defs>
  <rect width="1200" height="700" rx="20" fill="#F5F6F8"/>
  <text x="40" y="58" font-size="28" font-weight="700" fill="#0F2233">How Earmark works</text>
  <text x="40" y="88" font-size="17" fill="#3C4B5A">Money given for a purpose can only be spent on that purpose: the contract decides who can be paid.</text>

  <!-- Funder -->
  <rect x="40" y="200" width="230" height="150" rx="14" fill="#fff" stroke="#DCE1E6" stroke-width="2"/>
  <text x="62" y="236" font-size="13" font-weight="700" fill="#5B6775" letter-spacing="1">1 · FUNDER</text>
  <text x="62" y="266" font-size="20" font-weight="700" fill="#0F2233">You</text>
  <text x="62" y="292" font-size="14" fill="#3C4B5A">a company, a client,</text>
  <text x="62" y="312" font-size="14" fill="#3C4B5A">an NGO, a grant giver</text>
  <text x="62" y="336" font-size="13" fill="#0F6B5C">approves who can be paid</text>

  <!-- Arrow funder -> pot -->
  <line x1="272" y1="275" x2="400" y2="275" stroke="#0F6B5C" stroke-width="3" marker-end="url(#g)"/>
  <text x="282" y="244" font-size="13" font-weight="600" fill="#0F6B5C">locks</text><text x="282" y="262" font-size="13" font-weight="600" fill="#0F6B5C">5,000 USDC</text>

  <!-- Pot -->
  <rect x="404" y="160" width="290" height="250" rx="16" fill="#E3F1EE" stroke="#0F6B5C" stroke-width="3"/>
  <text x="428" y="196" font-size="13" font-weight="700" fill="#0F6B5C" letter-spacing="1">2 · THE POT (smart contract)</text>
  <text x="428" y="228" font-size="21" font-weight="700" fill="#0F2233">Office fit-out · Phase 1</text>
  <text x="428" y="256" font-size="15" fill="#3C4B5A">5,000 USDC · ends 30 Nov</text>
  <text x="428" y="290" font-size="14" font-weight="600" fill="#0F2233">Approved payees</text>
  <text x="428" y="314" font-size="14" fill="#157A55">✓ Halden Building Supplies</text>
  <text x="428" y="336" font-size="14" fill="#157A55">✓ Brightline Electrical</text>
  <text x="428" y="372" font-size="13" fill="#5B6775">No owner · no admin key · no fees</text>
  <text x="428" y="392" font-size="13" fill="#5B6775">Rules are enforced on Arc</text>

  <!-- Recipient -->
  <rect x="404" y="470" width="320" height="120" rx="14" fill="#fff" stroke="#DCE1E6" stroke-width="2"/>
  <text x="428" y="504" font-size="13" font-weight="700" fill="#5B6775" letter-spacing="1">3 · RECIPIENT</text>
  <text x="428" y="532" font-size="18" font-weight="700" fill="#0F2233">A contractor, an employee,</text>
  <text x="428" y="554" font-size="18" font-weight="700" fill="#0F2233">a project lead</text>
  <text x="428" y="578" font-size="13" fill="#3C4B5A">presses "Pay" — but only to approved payees</text>
  <line x1="549" y1="468" x2="549" y2="414" stroke="#5B6775" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#k)"/>
  <text x="560" y="446" font-size="13" fill="#5B6775">asks the pot to pay</text>

  <!-- Allowed payees -->
  <rect x="860" y="130" width="300" height="72" rx="12" fill="#fff" stroke="#157A55" stroke-width="2.5"/>
  <text x="882" y="162" font-size="17" font-weight="700" fill="#157A55">✓ Halden Building Supplies</text>
  <text x="882" y="186" font-size="13" fill="#3C4B5A">paid 4,000 USDC · "PO-1042 · materials"</text>
  <rect x="860" y="222" width="300" height="72" rx="12" fill="#fff" stroke="#157A55" stroke-width="2.5"/>
  <text x="882" y="254" font-size="17" font-weight="700" fill="#157A55">✓ Brightline Electrical</text>
  <text x="882" y="278" font-size="13" fill="#3C4B5A">paid 600 USDC · "Invoice BL-218 · wiring"</text>
  <path d="M696 240 C780 240 780 166 856 166" fill="none" stroke="#157A55" stroke-width="3" marker-end="url(#g)"/>
  <path d="M696 262 C780 262 780 258 856 258" fill="none" stroke="#157A55" stroke-width="3" marker-end="url(#g)"/>

  <!-- Blocked -->
  <rect x="860" y="340" width="300" height="64" rx="12" fill="#FDECEC" stroke="#B42318" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="882" y="368" font-size="16" font-weight="700" fill="#B42318">✕ Recipient's own wallet</text>
  <text x="882" y="390" font-size="13" fill="#B42318">blocked by the contract</text>
  <rect x="860" y="420" width="300" height="64" rx="12" fill="#FDECEC" stroke="#B42318" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="882" y="448" font-size="16" font-weight="700" fill="#B42318">✕ Anyone else</text>
  <text x="882" y="470" font-size="13" fill="#B42318">blocked until the funder approves</text>
  <path d="M696 330 C780 330 790 372 846 372" fill="none" stroke="#B42318" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#r)"/>
  <path d="M696 352 C770 352 790 452 846 452" fill="none" stroke="#B42318" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#r)"/>

  <!-- Receipts + return -->
  <rect x="40" y="620" width="1120" height="56" rx="12" fill="#0F2233"/>
  <text x="64" y="654" font-size="16" fill="#fff"><tspan font-weight="700">4 · Receipts:</tspan> every payment is recorded on Arc with amount, memo and payee — anyone can verify it from a link or QR code.</text>
  <path d="M404 380 C330 420 200 420 155 352" fill="none" stroke="#5B6775" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#k)"/>
  <text x="120" y="450" font-size="13" fill="#5B6775">After the end date, unspent</text>
  <text x="120" y="468" font-size="13" fill="#5B6775">money goes back to the funder</text>
</svg>
